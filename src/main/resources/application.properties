
# Nome da aplicacao
spring.application.name=ecoenergia

# Conexao com Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuracao JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Configuracao Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
# Marca o ponto de partida como versao 0, para a V1 em diante ser executada
spring.flyway.baseline-version=0

# Tarifa de energia (R$ por kWh) usada no calculo do custo estimado
ecoenergia.tarifa-kwh=0.85
